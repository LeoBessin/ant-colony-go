# Harnais web de la simulation : http://localhost:8080
# Indicatif uniquement — les mesures du rapport viennent de run_benchmarks.sh.
services:
  antweb:
    build: .
    image: antcolony/antweb:latest
    # Pas de port publié sur l'hôte : en déploiement (Coolify), le proxy
    # joint le conteneur par le réseau Docker, et un port hôte fixe entre en
    # collision avec tout autre service déjà sur 8080. Le port 8080:8080 pour
    # un lancement local est dans docker-compose.override.yml, que
    # `docker compose up` charge d'office (Coolify passe -f et l'ignore).
    expose:
      - "8080"
    restart: unless-stopped
    # Plafond dur côté hôte, en plus des limites applicatives
    # (internal/uiserver/limits.go) : même un bug ou une requête imprévue ne
    # peut pas prendre plus de 2 cœurs ni 512 Mo au VPS.
    # Go ne lit le quota CPU du cgroup que si go.mod déclare >= 1.25 (ici
    # 1.24) : sans GOMAXPROCS, le runtime lancerait un thread par cœur de
    # l'hôte et se ferait brider par le quota. À garder égal à `cpus`.
    # Go ne lit pas non plus la limite mémoire, d'où GOMEMLIMIT, qui fait
    # ramasser le GC avant que le noyau ne tue le conteneur. Pic mesuré :
    # 52 Mo (naive, large).
    cpus: "2"
    mem_limit: 512m
    pids_limit: 256
    environment:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 400MiB
      # Authentification HTTP Basic, appliquée par antweb lui-même (et non
      # par le proxy : Coolify ne substitue pas les variables dans les labels,
      # et ses noms de routeurs Traefik lui sont propres). Valeurs à
      # renseigner dans Coolify > Environment Variables ; rien dans le dépôt.
      # Sans mot de passe, l'auth est désactivée (usage local) et antweb
      # l'annonce au démarrage. /healthz reste ouvert pour le healthcheck.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    # Le binaire se sonde lui-même : l'image distroless n'a ni curl ni wget.
    healthcheck:
      test: ["CMD", "/antweb", "-healthcheck", "-addr", "localhost:8080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # antweb gère SIGTERM : arrêt propre, flux SSE fermés, benchs annulés.
    stop_grace_period: 5s
